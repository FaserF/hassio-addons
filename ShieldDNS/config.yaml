name: "ShieldDNS (Edge)"
version: "2.5.21-dev-20261121-1316-cff82d6"
slug: "shielddns"
description: "DNS-over-TLS/HTTPS proxy with ad blocking, filtering and admin UI"
url: "https://github.com/FaserF/hassio-addons/tree/master/ShieldDNS"
arch:
  - aarch64
  - amd64
init: false
host_network: true
ingress: true
ingress_entry: "admin/"
panel_icon: "mdi:shield-check-outline"
startup: system
services:
  - mysql:want
discovery:
  - shielddns
map:
  - homeassistant_config:rw
  - ssl:rw
options:
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: "info"
  # DoT Port (Required for Android "Private DNS" Native Setting, standard 853)
  dot_port: 853
  # DoH Port (Standard HTTPS 443 for DNS-over-HTTPS)
  doh_port: 443
  database_type: "sqlite"
  database_url: ""
  developer_mode: false
  github_token: ""
schema:
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  dot_port: port?
  doh_port: port?
  database_type: list(sqlite|mariadb|external)?
  database_url: password?
  developer_mode: bool?
  github_token: password?
# ports:
#   # With host_network: true, we do not map ports via Docker.
#   # The App binds directly to the ports defined in 'options'.
#   # Removing this section avoids the "Network" configuration tab in HA, which is misleading here.
#   # 853/tcp: 853
#   # 443/tcp: 3443
stage: experimental
