configuration:
  certfile:
    name: Zertifikatsdatei
    description: "Der Name deiner SSL-Zertifikatsdatei im /ssl/ Verzeichnis."
  keyfile:
    name: Privater Schlüssel
    description: "Der Name deiner privaten Schlüsseldatei im /ssl/ Verzeichnis."
  log_level:
    name: Log Level
    description: "Steuert die Detailgenauigkeit der Protokolle."
  dot_port:
    name: DoT Port
    description: "Port für DNS-over-TLS (Standard: 8853)."
  doh_port:
    name: DoH Port
    description: "Port für DNS-over-HTTPS (Standard: 3443)."
  developer_mode:
    name: Entwickler-Modus
    description: "Wenn aktiviert, lädt das Addon bei jedem Start den aktuellen GitHub-Code herunter und kompiliert ihn."
  github_token:
    name: GitHub Token
    description: "Optionales persönliches Zugriffs-Token für die GitHub-API (nützlich bei privaten Repositories oder Rate-Limits)."
