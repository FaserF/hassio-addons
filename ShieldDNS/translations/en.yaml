configuration:
  certfile:
    name: Certificate File
    description: "Your SSL certificate file name in /ssl/."
  keyfile:
    name: Private Key File
    description: "Your SSL private key file name in /ssl/."
  log_level:
    name: Log Level
    description: "Controls the verbosity of the app logs."
  dot_port:
    name: DoT Port
    description: "Port to listen on for DNS-over-TLS (Default: 8853)."
  doh_port:
    name: DoH Port
    description: "Port to listen on for DNS-over-HTTPS (Default: 3443)."
  developer_mode:
    name: Developer Mode
    description: "When enabled, the addon downloads and compiles the latest code from GitHub on every start."
  github_token:
    name: GitHub Token
    description: "Optional Personal Access Token for GitHub API access (useful for private repositories or rate limits)."
