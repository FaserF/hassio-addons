configuration:
  omniroute_url:
    name: "OmniRoute URL"
    description: "Die Basis-URL deiner OmniRoute-Instanz (z. B. https://omniroute.fabiseitz.de/v1)."
  omniroute_api_key:
    name: "OmniRoute API-Schlüssel"
    description: "API-Schlüssel zur Authentifizierung an deiner OmniRoute-Instanz."
  model:
    name: "Haupt-Modell / Kaskade"
    description: "Primäres LLM-Modell für komplexe Coding-Aufgaben, Fehlerbehebung und Automationen (z. B. omniroute/coding-cascade)."
  small_model:
    name: "Schnelles Modell / Kaskade"
    description: "Schnelles Modell für Syntaxprüfungen und zügige Datei-Edits (z. B. omniroute/fast-cascade)."
  workspace:
    name: "Arbeitsverzeichnis"
    description: "Das im Paseo-Editor standardmäßig geöffnete Wurzelverzeichnis (Standard: /config)."
  remote_access:
    name: "Remote-API-Zugriff"
    description: "Direkten Port 6767 für externe Agenten-Steuerung von der Oracle VM, Hermes oder Tailscale freigeben."
  log_level:
    name: "Protokollierungsstufe"
    description: "Steuert die Detailtiefe der Add-on-Logs (info, debug, warning, error)."
network:
  6767/tcp: "Direkter Web- & MCP-Agent-API-Port"
