  workspace: "/config"
  developer_recommendations: false
  remote_access: true
  max_memory_mb: 0
  cpu_priority: "low"
  log_level: "info"
schema:
  omniroute_url: "str"
  omniroute_api_key: "password?"
  model: "str"
  small_model: "str"
  workspace: "str"
  developer_recommendations: "bool?"
  remote_access: "bool"
  max_memory_mb: "int?"
  cpu_priority: "list(normal|low|idle)?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)?"
stage: "experimental"
image: "ghcr.io/faserf/hassio-addons-paseo-{arch}"
