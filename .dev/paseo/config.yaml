---
name: "Paseo"
version: "0.1.6"
slug: "paseo"
description: "Autonomous AI Code Studio & Web IDE powered by OmniRoute and OpenCode."
url: "https://github.com/FaserF/hassio-addons/tree/master/.dev/paseo"
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8099
panel_icon: "mdi:code-tags"
panel_title: "Paseo"
homeassistant_api: true
hassio_api: true
hassio_role: "default"
map:
  - config:rw
  - share:rw
  - ssl:rw
  - addons:rw
  - all_addon_configs:rw
ports:
  6767/tcp: 6767
ports_description:
  6767/tcp: "Direct Web & MCP Agent API Port (for remote control / Tailscale)"
options:
  omniroute_url: "https://omniroute.fabiseitz.de/v1"
  omniroute_api_key: ""
  model: "omniroute/coding-cascade"
