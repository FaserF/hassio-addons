---
name: NGINX
version: 0.4.12
slug: nginx
description: Open Source Webserver with PHP and MariaDB.
url: https://github.com/FaserF/hassio-addons/tree/master/nginx
arch:
  - aarch64
  - amd64
image: ghcr.io/faserf/hassio-addons-nginx-{arch}
# webui: http://[HOST]:[PORT:80]
map:
  - ssl:rw
  - share:rw
  - homeassistant_config:rw
ingress: true
ingress_port: 80
hassio_api: true
init: false
panel_icon: mdi:web-box
discovery:
  - webserver_app
options:
  document_root: /share/htdocs
  php_ini: default
  default_conf: default
  default_ssl_conf: default
  website_name: "web.local"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: "info"
  init_commands: []
  stream_gateway:
    enabled: false
    port: 8097
    rclone_enabled: false
    rclone_config: "/share/rclone/rclone.conf"
    rclone_remote: "cloud_pool_crypt:"
    cache_enabled: true
    cache_path: "/share/nginx/stream_cache"
    cache_size: "10g"
    upstream_url: ""
schema:
  document_root: str
  php_ini: str
  default_conf: str
  default_ssl_conf: str
  website_name: str
  username: str?
  password: password?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  init_commands:
    - str?
  stream_gateway:
    enabled: bool?
    port: port?
    rclone_enabled: bool?
    rclone_config: str?
    rclone_remote: str?
    cache_enabled: bool?
    cache_path: str?
    cache_size: str?
    upstream_url: str?
ports:
  80/tcp: 80
  443/tcp: 8324
  8097/tcp: 8097
ports_description:
  80/tcp: Web interface http
  443/tcp: SSL Web interface
  8097/tcp: Media stream gateway & rclone proxy
stage: experimental
