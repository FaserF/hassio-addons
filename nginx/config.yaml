---
name: NGINX (Edge)
version: 0.4.15-dev-20261119-0541-039da7c
slug: nginx
description: Open Source Webserver with PHP and MariaDB.
url: https://github.com/FaserF/hassio-addons/tree/master/nginx
arch:
  - aarch64
  - amd64
# webui: http://[HOST]:[PORT:80]
map:
  - ssl:rw
  - share:rw
  - homeassistant_config:rw
ingress: true
ingress_port: 80
hassio_api: true
init: false
panel_icon: mdi:web-box
discovery:
  - webserver_app
options:
  document_root: /share/htdocs
  php_ini: default
  default_conf: default
  default_ssl_conf: default
  website_name: "web.local"
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  log_level: "notice"
  init_commands: []
  stream_gateway:
    enabled: false
    port: 8097
    rclone_enabled: false
    rclone_config: "/share/rclone/rclone.conf"
    rclone_remote: "cloud_pool_crypt:"
    cache_enabled: true
    cache_path: "/share/nginx/stream_cache"
    cache_size: "10g"
    upstream_url: ""
    vfs_cache_mode: "full"
    cache_dir: "/data/rclone_cache"
    vfs_cache_max_size: "10G"
    vfs_cache_max_age: "24h"
    vfs_read_chunk_size: "8M"
    vfs_read_chunk_size_limit: "64M"
    buffer_size: "32M"
    vfs_read_ahead: "64M"
schema:
  document_root: str
  php_ini: str
  default_conf: str
  default_ssl_conf: str
  website_name: str
  username: str?
  password: password?
  ssl: bool
  certfile: str
  keyfile: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  init_commands:
    - str?
  stream_gateway:
    enabled: bool?
    port: port?
    rclone_enabled: bool?
    rclone_config: str?
    rclone_remote: str?
    cache_enabled: bool?
    cache_path: str?
    cache_size: str?
    upstream_url: str?
    vfs_cache_mode: list(off|minimal|writes|full)?
    cache_dir: str?
    vfs_cache_max_size: str?
    vfs_cache_max_age: str?
    vfs_read_chunk_size: str?
    vfs_read_chunk_size_limit: str?
    buffer_size: str?
    vfs_read_ahead: str?
ports:
  80/tcp: 10080
  443/tcp: 18324
  8097/tcp: 18097
ports_description:
  80/tcp: Web interface http
  443/tcp: SSL Web interface
  8097/tcp: Media stream gateway & rclone proxy
stage: experimental
