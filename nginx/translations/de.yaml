configuration:
  document_root:
    name: "Dokumenten-Stammverzeichnis"
    description: "Verzeichnis, in dem sich die Webseiten befinden."
  php_ini:
    name: "PHP-Konfigurationsdatei"
    description: "Name der zu verwendenden PHP-Konfigurationsdatei."
  default_conf:
    name: "NGINX-Konfigurationsdatei"
    description: "Name der zu verwendenden NGINX-Konfigurationsdatei."
  default_ssl_conf:
    name: "NGINX-SSL-Konfigurationsdatei"
    description: "Name der zu verwendenden NGINX-SSL-Konfigurationsdatei."
  website_name:
    name: "Name der Webseite"
    description: "Name der Webseite."
  username:
    name: "Benutzername"
    description: "Benutzername für die Basic Authentication."
  password:
    name: "Passwort"
    description: "Passwort für die Basic Authentication."
  ssl:
    name: "SSL aktivieren"
    description: "Aktiviert die SSL-Unterstützung."
  certfile:
    name: "Zertifikatsdatei"
    description: "Name der Zertifikatsdatei."
  keyfile:
    name: "Private Schlüsseldatei"
    description: "Name der privaten Schlüsseldatei."
  init_commands:
    name: "Startbefehle"
    description: "Liste benutzerdefinierter Befehle, die beim Start ausgeführt werden sollen."
  log_level:
    name: Log Level
    description: "Steuert die Detailgenauigkeit der Protokolle."
  stream_gateway:
    name: "Stream-Gateway"
    description: "Medien-Streaming-Gateway und optionale Rclone-Proxy-Konfiguration."
    enabled:
      name: "Stream-Gateway aktivieren"
      description: "Aktiviert das performante Medien-Streaming-Gateway."
    port:
      name: "Gateway-Port"
      description: "Port, auf dem das Medien-Streaming-Gateway lauscht."
    rclone_enabled:
      name: "Rclone-Proxy aktivieren"
      description: "Startet internen Rclone-Daemon zum Streamen von Cloud-Remotes."
    rclone_config:
      name: "Rclone-Konfigurationsdatei"
      description: "Pfad zur rclone.conf-Datei."
    rclone_remote:
      name: "Rclone-Remote"
      description: "Rclone Remote-Name und Pfad (z. B. cloud_pool_crypt:)."
    cache_enabled:
      name: "Stream-Cache aktivieren"
      description: "Aktiviert das Caching gestreamter Medien-Chunks."
    cache_path:
      name: "Stream-Cache-Pfad"
      description: "Verzeichnis zum Speichern des Stream-Caches."
    cache_size:
      name: "Stream-Cache-Größe"
      description: "Maximale Größe des Stream-Caches (z. B. 10g)."
    upstream_url:
      name: "Benutzerdefinierte Upstream-URL"
      description: "Optionale benutzerdefinierte Upstream-URL zum Weiterleiten von Streams."
