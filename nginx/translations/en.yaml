configuration:
  document_root:
    name: "Document Root"
    description: "Directory where the websites are located."
  php_ini:
    name: "PHP Configuration File"
    description: "Name of the PHP configuration file to use."
  default_conf:
    name: "NGINX Configuration File"
    description: "Name of the NGINX configuration file to use."
  default_ssl_conf:
    name: "NGINX SSL Configuration File"
    description: "Name of the NGINX SSL configuration file to use."
  website_name:
    name: "Website Name"
    description: "Name of the website."
  username:
    name: "Basic Auth Username"
    description: "Username for Basic Authentication."
  password:
    name: "Basic Auth Password"
    description: "Password for Basic Authentication."
  ssl:
    name: "Enable SSL"
    description: "Enable SSL support."
  certfile:
    name: "Certificate File"
    description: "Name of the certificate file."
  keyfile:
    name: "Private Key File"
    description: "Name of the private key file."
  init_commands:
    name: "Init Commands"
    description: "List of custom commands to run at startup."
  log_level:
    name: "Log Level"
    description: "Controls the verbosity of the app logs."
  stream_gateway:
    name: "Stream Gateway"
    description: "Media streaming gateway and optional rclone proxy configuration."
    enabled:
      name: "Enable Stream Gateway"
      description: "Enable the high-performance media stream gateway."
    port:
      name: "Gateway Port"
      description: "Port for the media stream gateway to listen on."
    rclone_enabled:
      name: "Enable Rclone Proxy"
      description: "Start internal rclone daemon to stream from cloud remotes."
    rclone_config:
      name: "Rclone Config File"
      description: "Path to rclone.conf file."
    rclone_remote:
      name: "Rclone Remote"
      description: "Rclone remote name and path (e.g. cloud_pool_crypt:)."
    cache_enabled:
      name: "Enable Stream Cache"
      description: "Enable caching of streamed media chunks."
    cache_path:
      name: "Stream Cache Path"
      description: "Directory to store stream cache."
    cache_size:
      name: "Stream Cache Size"
      description: "Maximum size of the stream cache (e.g. 10g)."
    upstream_url:
      name: "Custom Upstream URL"
      description: "Optional custom upstream URL to proxy streams from."
    vfs_cache_mode:
      name: "VFS Cache Mode"
      description: "Cache mode for streaming (e.g. full, off, minimal, writes)."
    cache_dir:
      name: "Rclone Cache Directory"
      description: "Path for storing rclone local sparse VFS stream cache."
    vfs_cache_max_size:
      name: "VFS Cache Max Size"
      description: "Maximum size of rclone VFS cache (e.g. 10G)."
    vfs_cache_max_age:
      name: "VFS Cache Max Age"
      description: "Maximum age of cached chunks before eviction (e.g. 24h)."
    vfs_read_chunk_size:
      name: "VFS Read Chunk Size"
      description: "Initial chunk size for video playback startup (e.g. 8M)."
    vfs_read_chunk_size_limit:
      name: "VFS Read Chunk Size Limit"
      description: "Maximum chunk size scaling for sustained streams (e.g. 64M)."
    buffer_size:
      name: "Rclone Buffer Size"
      description: "Memory buffer size per open stream file (e.g. 32M)."
    vfs_read_ahead:
      name: "VFS Read Ahead"
      description: "Read ahead buffer size for smooth streaming playback (e.g. 64M)."
