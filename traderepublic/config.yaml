name: "Trade Republic Headless Browser (Edge)"
version: "1.1.3-dev-20260905-2033-c9e313a"
slug: "traderepublic"
description: "Trade Republic Headless Browser & Session Provider (WAF Solver & Keep-Alive)."
url: "https://github.com/FaserF/ha-traderepublic"
arch:
  - aarch64
  - amd64
init: false
startup: services
discovery:
  - traderepublic
map:
  - homeassistant_config:rw
panel_icon: mdi:finance
panel_title: "Trade Republic"
options:
  log_level: "info"
  keep_alive_interval: 60
  cache_retention_hours: 12
  auto_install_integration: true
  github_token: ""

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  keep_alive_interval: int
  cache_retention_hours: int
  auto_install_integration: bool
  github_token: str?

ports: {}
ports_description:
  8095/tcp: "Direct Web/API Access (disabled by default — use Ingress for secure access)"
hassio_api: true
ingress: true
ingress_port: 8095
ingress_entry: /
stage: experimental
