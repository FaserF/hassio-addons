name: "Trade Republic Headless Browser"
version: "0.1.0"
slug: "traderepublic"

image: ghcr.io/faserf/hassio-addons-traderepublic-{arch}
description: "Trade Republic Headless Browser & Session Provider (WAF Solver & Keep-Alive)."
url: "https://github.com/FaserF/ha-traderepublic"
arch:
  - aarch64
  - amd64
init: false
host_network: true
startup: services
discovery:
  - traderepublic
map:
  - homeassistant_config:rw
panel_icon: mdi:finance
panel_title: "Trade Republic"
options:
  log_level: "info"
  keep_alive_interval: 600
  auto_install_integration: true
  github_token: ""

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  keep_alive_interval: int
  auto_install_integration: bool
  github_token: str?

ports:
  8095/tcp: 8095
hassio_api: true
ingress: true
ingress_port: 8095
ingress_entry: /