configuration:
  log_level:
    name: "Log Level"
    description: "Control the logging verbosity of the add-on."
  keep_alive_interval:
    name: "Keep-Alive Interval (Seconds)"
    description: "Interval in seconds to ping/refresh the web session."
  cache_retention_hours:
    name: "Cache Retention Period (Hours)"
    description: "Duration in hours to retain and serve cached portfolio/metric data during session dropouts or offline periods (default: 12)."
  auto_install_integration:
    name: "Auto Install Integration"
    description: "Automatically install or update ha-traderepublic custom integration."
  github_token:
    name: "GitHub API Token"
    description: "Optional GitHub token for rate-limit free integration downloads."
  webhook_enabled:
    name: "Enable Webhooks"
    description: "Enable outbound webhook notifications for order executions, dividend payouts, and price threshold alerts."
  webhook_url:
    name: "Webhook URL"
    description: "Target URL to send event payloads to (e.g. http://100.64.0.1:8090/api/webhook/traderepublic)."
  webhook_token:
    name: "Webhook Bearer Token"
    description: "Optional authorization token sent with webhook payloads."
