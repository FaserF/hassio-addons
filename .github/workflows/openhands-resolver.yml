name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: github.event.label.name == 'openhands:ready'
    uses: FaserF/repo-template/.github/workflows/reusable-openhands-resolver.yml@v1
    secrets: inherit
