name: Orchestrator CI (Start)

on:
  pull_request_target:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  ci_start:
    name: 🚀 CI Start Notification (Privileged)
    # Only run on actual PRs from external human contributors (skip self-dev & dependency bots)
    if: >-
      github.event_name == 'pull_request_target' &&
      !contains(fromJSON('["FaserF", "faserf-hermes-agent", "faserf-hermes-agent[bot]", "app/faserf-hermes-agent", "renovate[bot]", "app/renovate", "dependabot[bot]", "app/dependabot"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
    steps:
      - name: Generate GitHub App token for Hermes
        id: app-token
        if: env.BOT_APP_ID != '' && env.BOT_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ env.BOT_APP_ID }}
          private-key: ${{ env.BOT_PRIVATE_KEY }}

      - name: 📝 Post CI Starting Comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: context.issue.number,
            });

            const signature = "<!-- ci-start-comment -->";
            const body = `## 🚀 CI Build Starting\n\nI'm now running the CI checks for this PR. Please wait for the results below.\n\n${signature}`;
            const existingComment = comments.find(c => c.user.type === 'Bot' && c.body.includes(signature));

            if (existingComment) {
                console.log(`Updating existing CI start comment ${existingComment.id}...`);
                await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                    body: body
                });
            } else {
                await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: body
                });
            }
