default: true
MD013: false # Line length — URLs and long changelog entries make this impractical
line-length: false # Alias for MD013
MD024: false # Multiple headers with same content — intentional in changelogs (Added/Fixed/Changed repeat per version)
MD026: false # Trailing punctuation in headers
MD029: false # Ordered list item prefix — allow "all ones" style (1. 1. 1.)
MD005: false # Inconsistent list indentation — allow flexible indentation
MD007: false # Unordered list indentation — allow flexible indentation
MD033: # Inline HTML — allow common safe elements
  allowed_elements:
    - img
    - a
    - div
    - h1
    - p
    - table
    - thead
    - tr
    - th
    - tbody
    - td
    - strong
    - br
    - svg
    - path
    - span
    - details
    - summary
MD025: false # Allow frontmatter title + H1 if needed, or just handle manually
MD028: false # Allow blank lines between blockquotes (needed for GH alerts)
MD036: false # Allow emphasis as heading
MD046: false # Code block style (indent vs fence)
MD060: false # Table column pipe alignment
