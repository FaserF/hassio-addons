---
name: "Antigravity"
version: "1.0.0"
slug: "antigravity"
image: "ghcr.io/faserf/hassio-addons-antigravity-{arch}"
description: "Google Antigravity Quota Monitor, Multi-Account Dashboard, and Dynamic Polling Gateway for Home Assistant."
url: "https://github.com/FaserF/hassio-addons/tree/master/antigravity"
arch:
  - aarch64
  - amd64
init: false
startup: services
ingress: true
ingress_port: 8199
panel_icon: "mdi:google-analytics"
panel_title: "Antigravity"
hassio_api: true
map:
  - share:rw
  - config:ro

ports:
  8199/tcp: 8199
ports_description:
  8199/tcp: "Antigravity Web UI and REST API (Ingress recommended)"

options:
  log_level: "info"
  scan_interval: 1800
  adaptive_polling: true
  fast_poll_interval: 180
  idle_backoff_interval: 3600
  accounts:
    - name: "Primary Account"
      refresh_token: ""
      client_id: ""
      client_secret: ""
      project_id: ""

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  scan_interval: int
  adaptive_polling: bool
  fast_poll_interval: int?
  idle_backoff_interval: int?
  accounts:
    - name: str
      refresh_token: password?
      client_id: str?
      client_secret: password?
      project_id: str?
