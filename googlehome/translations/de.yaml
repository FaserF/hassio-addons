configuration:
  log_level:
    name: Protokollierungsgrad
    description: Steuert den Detailgrad der Protokollierung.
  auto_install_integration:
    name: Integration automatisch installieren
    description: Installiert oder aktualisiert die Google Home Integration automatisch in Home Assistant.
  github_token:
    name: GitHub-Token
    description: Optionales GitHub-Zugriffstoken zur Vermeidung von API-Ratenbegrenzungen.
  auto_stop_timeout:
    name: Automatisches Beenden nach Inaktivität (Minuten)
    description: Beendet dieses Add-on automatisch nach der angegebenen Inaktivitätsdauer in Minuten (0 zum Deaktivieren, Standard 60 Minuten).
