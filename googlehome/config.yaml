name: "Google Home Token Hub (Edge)"
version: "0.1.0"
slug: "googlehome"
description: "Google Home Master Token Generator & Ingress Authentication Hub for Home Assistant."
url: "https://github.com/FaserF/ha-googlehome"
arch:
  - aarch64
  - amd64
init: false
startup: services
discovery:
  - googlehome
map:
  - homeassistant_config:rw
panel_icon: mdi:google-assistant
panel_title: "Google Home"
options:
  log_level: "info"
  auto_install_integration: true
  github_token: ""

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  auto_install_integration: bool
  github_token: str?

ports: {}
ports_description:
  8195/tcp: "Direct Web/API Access (disabled by default — use Ingress for secure access)"
hassio_api: true
ingress: true
ingress_port: 8195
ingress_entry: /
stage: experimental
