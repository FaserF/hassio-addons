---
name: Alivro
version: "0.1.0"
slug: alivro
image: ghcr.io/faserf/hassio-addons-alivro-{arch}
description: Clinical AI-Powered Mental Health Companion for Depression, Burnout & Substance Harm Reduction.
url: https://github.com/FaserF/Alivro
arch:
  - aarch64
  - amd64
init: false
host_network: true
ingress: true
ingress_port: 8000
ingress_stream: true
panel_icon: mdi:heart-pulse
startup: services
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: Web Interface (HTTP)
map:
  - homeassistant_config:rw
  - share:rw
options:
  version: "latest"
  github_token: ""
  github_repo: "FaserF/Alivro"
  developer_mode: false
  reset_database: false
  log_level: "info"
  database:
    type: sqlite
  secret_key: ""
  project_name: "Alivro"
  debug: false
  demo_mode: false
  ai_provider: "gemini"
  release_type: "stable"
  environment: "production"
  default_locale: "en"
schema:
  version: str
  github_token: password?
  github_repo: str?
  developer_mode: bool
  reset_database: bool
  reset_database_confirm: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  database:
    type: list(sqlite|postgresql)
    postgresql_host: str?
    postgresql_port: port?
    postgresql_user: str?
    postgresql_password: password?
    postgresql_database: str?
  secret_key: password?
  project_name: str?
  debug: bool?
  demo_mode: bool
  gemini_api_key: password?
  ai_model: str?
  ai_provider: list(gemini)?
  release_type: list(developer|nightly|pre-release|stable)?
  first_admin_password: password?
  environment: str?
  default_locale: str?
stage: experimental
